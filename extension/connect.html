<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connect CaughtUp</title>
  <link rel="stylesheet" href="connect.css">
</head>
<body>
  <header>
    <span class="mark" aria-hidden="true">&#9993;</span>
    <strong>CaughtUp</strong>
  </header>
  <main>
    <div id="statusMark" class="status-mark" aria-hidden="true">&#10024;</div>
    <h1 id="title">Connecting CaughtUp</h1>
    <p id="message">Keep this page open while Google sign-in and Gmail access finish.</p>
    <div class="progress" aria-hidden="true"><span id="progress"></span></div>
    <section id="forwardingSetup" class="forwarding-setup hidden" aria-labelledby="forwardingHeading">
      <h2 id="forwardingHeading">Finish Gmail forwarding</h2>
      <p id="forwardingInstructions">Add this private address in Gmail's Forwarding settings.</p>
      <div id="forwardingAddressRow" class="address-row hidden">
        <code id="forwardingAddress"></code>
        <button id="copyForwarding" class="secondary compact" type="button">Copy address</button>
      </div>
      <p id="forwardingCode" class="detail hidden"></p>
      <button id="intakePrimary" class="primary" type="button">Turn on CaughtUp</button>
      <button id="intakeNewAddress" class="secondary compact hidden" type="button" hidden>Use a new address</button>
      <p id="forwardingTestStatus" class="detail" role="status" aria-live="polite"></p>
    </section>
    <p id="detail" class="detail" role="status" aria-live="polite">Starting secure Google sign-in…</p>
    <button id="retry" class="primary hidden" type="button">Try again</button>
    <button id="close" class="secondary hidden" type="button">Close this page</button>
    <p id="safety" class="safety">CaughtUp remains in Review mode. Connecting does not send any email.</p>
  </main>
  <script src="core.js"></script>
  <script src="forwarding.js"></script>
  <script src="connect.js"></script>
</body>
</html>
